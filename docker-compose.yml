services:
  postgres:
    image: postgres:16-alpine
    container_name: fintech_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fintech_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fintech_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintech_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4568
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fintech_agent}?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_key_offline_agent}
      MAX_TRANSFER_LIMIT_BDT: 400000
      DAILY_TRANSFER_LIMIT_BDT: 1000000
      JWT_SECRET: ${JWT_SECRET:-fintechathon-2026-sandbox-secret-jwt-key-bdt}
      ALLOW_DEMO_SEED: "${ALLOW_DEMO_SEED:-true}"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4567}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4567}
      TOTP_SECRET: ${TOTP_SECRET:-FINTECHATHON_2026_TOTP_KEY}
      STEP_UP_OTP_TTL_SECONDS: ${STEP_UP_OTP_TTL_SECONDS:-300}
      ALLOW_SANDBOX_MFA_BYPASS: "${ALLOW_SANDBOX_MFA_BYPASS:-false}"
    ports:
      - "4568:4568"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4568/api}
    container_name: fintech_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4567
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4568/api}
    ports:
      - "4567:4567"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

volumes:
  postgres_data:
