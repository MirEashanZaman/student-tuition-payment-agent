name: CI CD Pipeline

on:
  push:
    branches:
      - main
      - Eashan
  pull_request:
    branches:
      - main
      - Eashan

jobs:
  backend-ci:
    name: Backend Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Security Test Suite
        working-directory: ./backend
        env:
          FORCE_MEMORY_DB: "true"
        run: npm test

      - name: Build Backend Application
        working-directory: ./backend
        run: npm run build

  frontend-ci:
    name: Frontend Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4568/api
        run: npm run build

  docker-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: student-tuition-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: student-tuition-frontend:test

  security-scan:
    name: Codebase Cleanliness and Policy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Code Cleanliness and Constraints
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const ignore = ['node_modules', '.git', '.next', 'dist', 'coverage'];
          let errors = 0;
          const emojiRegex = /[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/u;
          function scan(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignore.includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) scan(full);
              else if (/\.(ts|tsx|js|json|md)$/.test(entry.name)) {
                const content = fs.readFileSync(full, 'utf8');
                const lines = content.split('\n');
                lines.forEach((line, i) => {
                  const trimmed = line.trim();
                  if (/\.(ts|tsx|js)$/.test(entry.name)) {
                    if (trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('*')) {
                      console.log('Disallowed comment in', full, 'line', i + 1);
                      errors++;
                    }
                  }
                  if (emojiRegex.test(line)) {
                    console.log('Disallowed emoji in', full, 'line', i + 1);
                    errors++;
                  }
                });
              }
            }
          }
          scan(process.cwd());
          if (errors > 0) {
            console.error('Scan failed with errors:', errors);
            process.exit(1);
          }
          console.log('Cleanliness scan passed.');
          "

  deployment-simulation:
    name: Deployment Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-verification, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Eashan'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Deployment Manifests
        run: |
          test -f docker-compose.yml
          test -f .env.example
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          echo "Deployment artifacts and manifests verified successfully."
